<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allure Test Reports</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 30px;
    }

    .report {
      background: white;
      padding: 18px 20px;
      margin-bottom: 12px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    .report a {
      font-size: 18px;
      text-decoration: none;
    }

    .meta {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Allure Test Reports</h1>

  <div class="report">
    <a href="../">Latest report</a>
    <div class="meta">
      Current Allure report
    </div>
  </div>

  <div class="report">
    <a href="./${GITHUB_RUN_ID}/">Deploy dev #${GITHUB_RUN_NUMBER}</a>
    <div class="meta">
      GitHub Actions run #${GITHUB_RUN_NUMBER}
    </div>
  </div>
</body>
</html>
